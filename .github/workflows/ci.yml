name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests mock GitHub, so they never touch the network.
      - run: npm run coverage
      - run: npm run build

      # One real end-to-end run against the GitHub API with the workflow's own token.
      - name: Smoke test the built CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node dist/cli.js --csv fixtures/recruiter.csv --no-cache --output out.json
          node -e "const out = require('./out.json'); if (out.length !== 4) { throw new Error('expected 4 records, got ' + out.length); }"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t candidate-transformer .
      - name: Run the image on the sample CSV
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/data" candidate-transformer \
            --csv fixtures/recruiter.csv --no-cache --format ndjson | wc -l | grep -qx 4
